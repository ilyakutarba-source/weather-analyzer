spring.application.name=weather-analyzer

spring.datasource.url=jdbc:postgresql://localhost:5433/weather_analyzer
spring.datasource.username=weather_user
spring.datasource.password=weather_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

weather.api.base-url=https://api.openweathermap.org
weather.api.api-key=${WEATHER_API_KEY:}
weather.api.latitude=53.9
weather.api.longitude=27.5667
weather.api.connect-timeout=5s
weather.api.read-timeout=10s

weather.scheduling.enabled=true
weather.scheduling.fixed-delay=PT15M
weather.scheduling.initial-delay=PT5S
